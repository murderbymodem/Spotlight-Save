[package]
name = "spotlight-save"
version = "1.0.0"
edition = "2021"
description = "Saves Windows Spotlight wallpapers to Pictures\\Spotlight"
license = "GPL-3.0-or-later"

[dependencies]
dirs = "6"
imagesize = "0.13"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
strip = true
